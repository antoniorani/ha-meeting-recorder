name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          for filename in ("repository.yaml", "meeting-recorder/config.yaml"):
              path = pathlib.Path(filename)
              with path.open("r", encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              if not isinstance(data, dict):
                  raise SystemExit(f"{filename} must contain a YAML mapping")
              print(f"{filename}: OK")
          PY

      - name: Validate shell and Python syntax
        run: |
          bash -n meeting-recorder/rootfs/usr/local/bin/ha-meeting-recorder-entrypoint
          python -m py_compile meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api

      - name: Validate recording retention policy
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from pathlib import Path
          import runpy
          import tempfile

          namespace = runpy.run_path(
              "meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api",
              run_name="meeting_recorder_retention_test",
          )
          cleanup = namespace["cleanup_recordings"]
          if namespace["SEGMENT_RETENTION_DAYS"] != 14:
              raise SystemExit("Segment retention must be 14 days")
          if namespace["RECORDING_RETENTION_DAYS"] != 60:
              raise SystemExit("Recording retention must be 60 days")

          now = datetime.now().astimezone()

          def make_session(root: Path, days_old: int, session_id: str) -> Path:
              stamp = (now - timedelta(days=days_old)).strftime("%Y-%m-%d_%H%M%S")
              session = root / f"{stamp}_{session_id}"
              (session / "segments").mkdir(parents=True)
              (session / "segments" / "segment_00000.ogg").write_bytes(b"segment")
              (session / "audio.mp3").write_bytes(b"audio")
              return session

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              recent = make_session(root, 5, "11111111")
              segment_expired = make_session(root, 15, "22222222")
              recording_expired = make_session(root, 61, "33333333")
              active = make_session(root, 61, "44444444")
              unrelated = root / "do-not-touch"
              unrelated.mkdir()
              (unrelated / "segments").mkdir()

              result = cleanup(root, active_session=active, now=now.timestamp())

              if not (recent / "segments").is_dir():
                  raise SystemExit("Recent segments were deleted too early")
              if (segment_expired / "segments").exists():
                  raise SystemExit("15-day-old segments were not deleted")
              if not (segment_expired / "audio.mp3").is_file():
                  raise SystemExit("Final MP3 was deleted at the 14-day threshold")
              if recording_expired.exists():
                  raise SystemExit("61-day-old recording directory was not deleted")
              if not (active / "segments").is_dir():
                  raise SystemExit("Active recording was modified by retention")
              if not (unrelated / "segments").is_dir():
                  raise SystemExit("Unrelated directory was modified by retention")
              if result != {"segments": 1, "sessions": 1}:
                  raise SystemExit(f"Unexpected retention result: {result}")

              second = cleanup(root, active_session=active, now=now.timestamp())
              if second != {"segments": 0, "sessions": 0}:
                  raise SystemExit(f"Retention cleanup is not idempotent: {second}")

          print("Recording retention policy: OK")
          PY

      - name: Validate legacy Opus migration
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import runpy
          import subprocess
          import tempfile

          namespace = runpy.run_path(
              "meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api",
              run_name="meeting_recorder_mp3_migration_test",
          )
          migrate = namespace["migrate_legacy_recordings"]
          normalize = namespace["normalize_existing_mp3s"]
          reconcile = namespace["reconcile_migrated_state"]
          original_run = namespace["run"]
          now = datetime.now().astimezone()

          def session(root: Path, suffix: str) -> Path:
              stamp = now.strftime("%Y-%m-%d_%H%M%S")
              path = root / f"{stamp}_{suffix}"
              path.mkdir()
              return path

          def fake_run(args, *, check=True, timeout=10, capture=True):
              if args[0] == "ffprobe":
                  target = Path(args[-1])
                  if target.exists() and target.read_bytes() == b"broken":
                      raise subprocess.CalledProcessError(1, args, "", "invalid mp3")
                  return subprocess.CompletedProcess(
                      args,
                      0,
                      '{"streams":[{"codec_name":"mp3","sample_rate":"48000","channels":2}],"format":{"duration":"42.0"}}',
                      "",
                  )
              if args[0] == "ffmpeg":
                  source = args[args.index("-i") + 1]
                  if "33333333" in source or "77777777" in source:
                      return subprocess.CompletedProcess(args, 1, "", "synthetic failure")
                  Path(args[-1]).write_bytes(b"mp3")
                  return subprocess.CompletedProcess(args, 0, "", "")
              return original_run(
                  args,
                  check=check,
                  timeout=timeout,
                  capture=capture,
              )

          migrate.__globals__["run"] = fake_run

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)

              convert = session(root, "11111111")
              (convert / "audio.opus").write_bytes(b"opus")

              state_file = root / "state.json"
              state_file.write_text(
                  '{"state":"completed","audio_path":"' + str(convert / "audio.opus") + '"}',
                  encoding="utf-8",
              )

              already_done = session(root, "22222222")
              (already_done / "audio.opus").write_bytes(b"opus")
              (already_done / "audio.mp3").write_bytes(b"mp3")

              failed = session(root, "33333333")
              (failed / "audio.opus").write_bytes(b"opus")

              repair = session(root, "44444444")
              (repair / "audio.opus").write_bytes(b"opus")
              (repair / "audio.mp3").write_bytes(b"broken")

              legacy_mp3 = session(root, "55555555")
              (legacy_mp3 / "audio.mp3").write_bytes(b"ID3legacy-Info")

              compatible_mp3 = session(root, "66666666")
              (compatible_mp3 / "audio.mp3").write_bytes(b"\xff\xfbcompatible")

              failed_mp3 = session(root, "77777777")
              (failed_mp3 / "audio.mp3").write_bytes(b"ID3keep-on-failure")

              unrelated = root / "do-not-touch"
              unrelated.mkdir()
              (unrelated / "audio.opus").write_bytes(b"opus")
              (unrelated / "audio.mp3").write_bytes(b"ID3do-not-touch")

              result = migrate(root, bitrate_kbps=64)
              if result != {"migrated": 3, "failed": 1}:
                  raise SystemExit(f"Unexpected migration result: {result}")

              if (convert / "audio.opus").exists() or not (convert / "audio.mp3").is_file():
                  raise SystemExit("Legacy Opus was not safely replaced by MP3")
              if (already_done / "audio.opus").exists():
                  raise SystemExit("Redundant Opus was not removed beside valid MP3")
              if not (failed / "audio.opus").is_file() or (failed / "audio.mp3").exists():
                  raise SystemExit("Failed migration did not preserve the Opus source")
              if (repair / "audio.opus").exists() or (repair / "audio.mp3").read_bytes() != b"mp3":
                  raise SystemExit("Invalid existing MP3 was not safely repaired")
              if not (unrelated / "audio.opus").is_file():
                  raise SystemExit("Migration modified an unrelated directory")

              normalization = normalize(root, bitrate_kbps=64)
              if normalization != {"normalized": 1, "failed": 1}:
                  raise SystemExit(f"Unexpected MP3 normalization result: {normalization}")
              if (legacy_mp3 / "audio.mp3").read_bytes() != b"mp3":
                  raise SystemExit("Legacy MP3 was not rewritten to the compatibility profile")
              if (compatible_mp3 / "audio.mp3").read_bytes() != b"\xff\xfbcompatible":
                  raise SystemExit("Compatible MP3 was unnecessarily rewritten")
              if (failed_mp3 / "audio.mp3").read_bytes() != b"ID3keep-on-failure":
                  raise SystemExit("Failed MP3 normalization did not preserve the source")
              if (unrelated / "audio.mp3").read_bytes() != b"ID3do-not-touch":
                  raise SystemExit("MP3 normalization modified an unrelated directory")

              if not reconcile(state_file):
                  raise SystemExit("Migrated state path was not updated")
              state = state_file.read_text(encoding="utf-8")
              if str(convert / "audio.mp3") not in state or "audio.opus" in state:
                  raise SystemExit("State still points to legacy Opus after migration")
              if reconcile(state_file):
                  raise SystemExit("State reconciliation is not idempotent")

              second = migrate(root, bitrate_kbps=64)
              if second != {"migrated": 0, "failed": 1}:
                  raise SystemExit(f"Migration is not idempotent: {second}")

              second_normalization = normalize(root, bitrate_kbps=64)
              if second_normalization != {"normalized": 0, "failed": 1}:
                  raise SystemExit(
                      f"MP3 normalization is not idempotent: {second_normalization}"
                  )

          print("Legacy Opus migration and MP3 normalization: OK")
          PY

      - name: Validate injected JavaScript
        run: node --check meeting-recorder/rootfs/usr/local/share/meeting-recorder/controls.js

      - name: Check Home Assistant app configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          import yaml

          with open("meeting-recorder/config.yaml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)

          required = {"name", "version", "slug", "description", "arch"}
          missing = sorted(required - set(config))
          if missing:
              raise SystemExit("Missing required keys: " + ", ".join(missing))

          if config["arch"] != ["amd64"]:
              raise SystemExit("Current target must declare amd64 only")

          if config["version"] != "2.0.1":
              raise SystemExit("Windows-compatible MP3 output must ship as version 2.0.1")

          if config.get("stage", "stable") != "stable":
              raise SystemExit("Meeting Recorder must be published with the stable lifecycle stage")

          if config.get("panel_icon") != "mdi:record-rec":
              raise SystemExit("Meeting Recorder must keep its recorder sidebar icon")

          icon = Path("meeting-recorder/icon.png").read_bytes()
          if icon[:8] != b"\x89PNG\r\n\x1a\n" or icon[12:16] != b"IHDR":
              raise SystemExit("meeting-recorder/icon.png must be a PNG image")
          width, height = struct.unpack(">II", icon[16:24])
          if (width, height) != (128, 128):
              raise SystemExit(f"App icon must be 128x128, got {width}x{height}")

          if config.get("ingress") is not True or config.get("ingress_port") != 8080:
              raise SystemExit("Meeting Recorder must use Home Assistant Ingress on port 8080")

          if "webui" in config or config.get("ports"):
              raise SystemExit("Ingress build must not publish a direct Selkies Web UI/port")

          media_maps = [
              item for item in config.get("map", [])
              if isinstance(item, dict) and item.get("type") == "media"
          ]
          if not media_maps or media_maps[0].get("read_only", True):
              raise SystemExit("Home Assistant media must be mapped read-write")

          for key in ("shm_size_mb", "segment_seconds", "audio_bitrate_kbps"):
              if key not in config.get("options", {}) or key not in config.get("schema", {}):
                  raise SystemExit(f"Missing recording option/schema: {key}")

          print("Home Assistant app config: OK")
          PY

      - name: Check capture and gateway policy
        run: |
          python - <<'PY'
          from pathlib import Path

          entry = Path("meeting-recorder/rootfs/usr/local/bin/ha-meeting-recorder-entrypoint").read_text(encoding="utf-8")
          required_entry = (
              "export SELKIES_PORT=8081",
              "export SELKIES_MICROPHONE_ON_START=demand",
              "export SELKIES_WEBCAM_ON_START=demand",
              "meeting-recorder-api",
              "nginx",
          )
          missing = [line for line in required_entry if line not in entry]
          if missing:
              raise SystemExit("Missing runtime settings: " + ", ".join(missing))

          nginx = Path("meeting-recorder/rootfs/etc/nginx/nginx.conf").read_text(encoding="utf-8")
          for required in ("listen 8080", "127.0.0.1:8081", "127.0.0.1:8099", "controls.js"):
              if required not in nginx:
                  raise SystemExit(f"Missing nginx gateway setting: {required}")

          api = Path("meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api").read_text(encoding="utf-8")
          if 'STATE_DIR = Path("/data/meeting-recorder")' not in api:
              raise SystemExit("Recorder state must live in /data/meeting-recorder")

          entry = Path("meeting-recorder/rootfs/usr/local/bin/ha-meeting-recorder-entrypoint").read_text(encoding="utf-8")
          for required in ('STATE_DIR="/data/meeting-recorder"', 'chown 1000:1000 "${STATE_DIR}"'):
              if required not in entry:
                  raise SystemExit(f"Missing writable recorder state setup: {required}")

          api = Path("meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api").read_text(encoding="utf-8")
          required_api = (
              'def finalize_meeting(',
              'def cleanup_recordings(',
              'def cleanup_retention(',
              'SEGMENT_RETENTION_DAYS = 14',
              'RECORDING_RETENTION_DAYS = 60',
              'RETENTION_SWEEP_SECONDS = 60 * 60',
              'RECORDER.cleanup_retention()',
              'FINAL_AUDIO_NAME = "audio.mp3"',
              'LEGACY_AUDIO_NAME = "audio.opus"',
              'def validate_mp3(',
              'def publish_mp3(',
              'def migrate_legacy_recordings(',
              'def normalize_existing_mp3s(',
              'def reconcile_migrated_state(',
              '"libmp3lame"',
              'def set_schedule(',
              'def cancel_schedule(',
              'def set_start_time(',
              'def cancel_start_time(',
              'def set_end_time(',
              'def cancel_end_time(',
              '"/recording/schedule"',
              '"/recording/stop"',
              '"/meeting/stop"',
              '"/meeting/start-time"',
              '"/meeting/end-time"',
              'CHROME_MARKERS',
          )
          missing_api = [item for item in required_api if item not in api]
          if missing_api:
              raise SystemExit("Missing finalization/scheduler API pieces: " + ", ".join(missing_api))

          controls = Path("meeting-recorder/rootfs/usr/local/share/meeting-recorder/controls.js").read_text(encoding="utf-8")
          for required in (
              "PLAY_ICON",
              "STOP_ICON",
              "Inicio",
              "Fin",
              "recording/schedule",
              "recording/stop",
              'addEventListener("change", syncSchedule)',
              "TOOLBAR_STATE_KEY",
              'id="mr-drag"',
              'id="mr-minimize"',
              'addEventListener("pointerdown", startToolbarDrag)',
              'addEventListener("pointermove", moveToolbar)',
              "localStorage.setItem",
              'classList.toggle("minimized"',
              '"Mostrar barra"',
          ):
              if required not in controls:
                  raise SystemExit(f"Missing recorder toolbar behavior: {required}")

          for forbidden in ('id="mr-save"', 'id="mr-clear"', ">Guardar<", ">Limpiar<"):
              if forbidden in controls:
                  raise SystemExit(f"Obsolete schedule button still present: {forbidden}")

          for required in (
              'CHROME_PROFILE_ROOT="/data/chrome-profile"',
              'CHROME_PROFILE_DIR="${CHROME_PROFILE_ROOT}/google-chrome"',
              'ln -s "${CHROME_PROFILE_DIR}" "${CHROME_CONFIG_PATH}"',
          ):
              if required not in entry:
                  raise SystemExit(f"Missing persistent Chrome profile setup: {required}")

          api = Path("meeting-recorder/rootfs/usr/local/bin/meeting-recorder-api").read_text(encoding="utf-8")
          forbidden = ("whisper", "transcription/retry", "session.json")
          for item in forbidden:
              if item in api.lower():
                  raise SystemExit(f"Recording-only API must not contain: {item}")

          dockerfile = Path("meeting-recorder/Dockerfile").read_text(encoding="utf-8")
          if "wyoming" in dockerfile.lower() or "meeting-recorder-transcribe" in dockerfile:
              raise SystemExit("Recording-only image must not contain Wyoming/transcription worker")

          if "grep -q 'libmp3lame'" not in dockerfile:
              raise SystemExit("Runtime image must verify the libmp3lame encoder")

          if 'temp_output.replace(output)' not in api or 'validate_mp3(temp_output)' not in api:
              raise SystemExit("Final MP3 must be validated before atomic publication")

          for required in (
              '"-map_metadata", "-1"',
              '"-ac", "2"',
              '"-ar", "48000"',
              '"-id3v2_version", "0"',
              '"-write_xing", "0"',
          ):
              if required not in api:
                  raise SystemExit(f"Missing Windows-compatible MP3 setting: {required}")

          if 'source.unlink()' not in api:
              raise SystemExit("Legacy Opus removal must happen only after MP3 publication")

          retention_call = api.index("RECORDER.cleanup_retention()")
          migration_call = api.index("migration = migrate_legacy_recordings(")
          if retention_call > migration_call:
              raise SystemExit("Retention must run before legacy transcoding")

          print("Selkies, Chrome persistence and MP3 finalization policy: OK")
          PY
