user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Keep Selkies at the ingress root, including its absolute asset/WebSocket URLs.
    # Only the entry document changes; ?desktop=1 selects the existing desktop.
    map $arg_desktop $landing_file {
        default /dashboard.html;
        1 /__meeting_recorder_desktop_entry__;
    }

    server {
        listen 8080;
        server_name _;

        location = /meeting-recorder/controls.js {
            alias /usr/local/share/meeting-recorder/controls.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location ^~ /meeting-recorder/api/ {
            proxy_pass http://127.0.0.1:8099/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
        }

        location = / {
            root /usr/local/share/meeting-recorder;
            try_files $landing_file @desktop;
            default_type text/html;
            add_header Cache-Control "no-store";
        }

        location = /meeting-recorder/dashboard.css {
            alias /usr/local/share/meeting-recorder/dashboard.css;
            default_type text/css;
            add_header Cache-Control "no-store";
        }

        location = /meeting-recorder/dashboard.js {
            alias /usr/local/share/meeting-recorder/dashboard.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location @desktop {
            include /etc/nginx/meeting-recorder-selkies.conf;
        }

        location / {
            include /etc/nginx/meeting-recorder-selkies.conf;
        }
    }
}
