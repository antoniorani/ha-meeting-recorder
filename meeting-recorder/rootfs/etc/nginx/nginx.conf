user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        location = /meeting-recorder/controls.js {
            alias /usr/local/share/meeting-recorder/controls.js;
            default_type application/javascript;
            add_header Cache-Control "no-store";
        }

        location ^~ /meeting-recorder/api/ {
            proxy_pass http://127.0.0.1:8099/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;

            # The control script is injected into Selkies' root HTML while all
            # streaming assets and WebSocket traffic remain otherwise untouched.
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html;
            sub_filter_once on;
            sub_filter '</body>' '<script defer src="meeting-recorder/controls.js"></script></body>';
        }
    }
}
