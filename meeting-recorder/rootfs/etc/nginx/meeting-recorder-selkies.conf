# Shared by Selkies' regular asset/WebSocket routes and the desktop entry page.
# Keeping its URLs at the ingress root avoids breaking Selkies' absolute paths.
proxy_pass http://127.0.0.1:8081;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
proxy_buffering off;

# Inject the existing recorder toolbar only into desktop HTML.
proxy_set_header Accept-Encoding "";
sub_filter_types text/html;
sub_filter_once on;
sub_filter '</body>' '<script defer src="meeting-recorder/controls.js"></script></body>';
