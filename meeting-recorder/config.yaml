name: "Meeting Recorder"
version: "0.5.0"
slug: "meeting_recorder"
description: "Persistent meeting browser with audio recording and post-meeting transcription"
url: "https://github.com/antoniorani/ha-meeting-recorder"
arch:
  - amd64
startup: application
boot: manual
init: false
stage: experimental
apparmor: false
privileged:
  - SYS_ADMIN
ingress: true
ingress_port: 8080
ingress_stream: true
panel_title: "Meeting Recorder"
panel_icon: "mdi:record-rec"
panel_admin: true
map:
  - type: media
    read_only: false
options:
  shm_size_mb: 2048
  segment_seconds: 300
  audio_bitrate_kbps: 64
  whisper_enabled: true
  whisper_host: "core-whisper"
  whisper_port: 10300
  whisper_language: "auto"
  whisper_connect_timeout_seconds: 10
  whisper_read_timeout_seconds: 1800
schema:
  shm_size_mb: "int(512,4096)"
  segment_seconds: "int(30,1800)"
  audio_bitrate_kbps: "int(32,192)"
  whisper_enabled: bool
  whisper_host: "str(1,255)"
  whisper_port: "int(1,65535)"
  whisper_language: "str(1,32)"
  whisper_connect_timeout_seconds: "int(1,60)"
  whisper_read_timeout_seconds: "int(60,7200)"
