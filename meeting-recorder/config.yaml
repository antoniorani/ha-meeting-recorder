name: "Meeting Recorder"
version: "0.1.0"
slug: "meeting_recorder"
description: "Experimental persistent Selkies browser session for the Meeting Recorder MVP"
url: "https://github.com/antoniorani/ha-meeting-recorder"
arch:
  - amd64
startup: application
boot: manual
init: false
stage: experimental
apparmor: false
privileged:
  - SYS_ADMIN
webui: "https://[HOST]:[PORT:8080]"
watchdog: "tcp://[HOST]:[PORT:8080]"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Selkies remote desktop (HTTPS)"
options:
  selkies_username: "meeting-recorder"
  selkies_password: "CHANGE_ME_BEFORE_START"
  shm_size_mb: 2048
schema:
  selkies_username: "str(1,64)"
  selkies_password: password
  shm_size_mb: "int(512,4096)"
